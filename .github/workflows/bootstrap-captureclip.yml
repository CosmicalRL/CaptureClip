name: Bootstrap CaptureClip Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write CaptureClip files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          PROJECT_FILES = {
              '.github/workflows/build.yml': 'name: Build APK\n\non:\n  workflow_dispatch:\n  push:\n    branches: [ "main" ]\n  pull_request:\n    branches: [ "main" ]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n    - name: Checkout Repository\n      uses: actions/checkout@v4\n\n    - name: Set up JDK 17\n      uses: actions/setup-java@v4\n      with:\n        java-version: \'17\'\n        distribution: \'temurin\'\n\n    - name: Setup Gradle\n      uses: gradle/actions/setup-gradle@v4\n      with:\n        gradle-version: \'8.2\'\n\n    - name: Build with Gradle\n      run: gradle assembleDebug\n\n    - name: Upload Finished APK\n      uses: actions/upload-artifact@v4\n      with:\n        name: app-debug\n        path: app/build/outputs/apk/debug/\n',
              'codemagic.yaml': 'workflows:\n  default:\n    name: Build APK\n    scripts:\n      - gradle assembleDebug\n    artifacts:\n      - app/build/outputs/apk/debug/*.apk\n',
              'settings.gradle': "include ':app'\n",
              'build.gradle': "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.2.2'\n    }\n}\n\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n\ntask clean(type: Delete) {\n    delete rootProject.buildDir\n}\n",
              'gradle.properties': 'android.useAndroidX=true\nandroid.enableJetifier=true\n\n',
              'app/build.gradle': 'plugins {\n    id \'com.android.application\'\n}\n\nandroid {\n    namespace \'com.capture.clipper\'\n    compileSdk 34\n\n    defaultConfig {\n        applicationId "com.capture.clipper"\n        minSdk 23\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n\n    buildTypes {\n        release {\n            minifyEnabled false\n            proguardFiles getDefaultProguardFile(\'proguard-android-optimize.txt\'), \'proguard-rules.pro\'\n        }\n    }\n\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n\ndependencies {\n    implementation \'androidx.appcompat:appcompat:1.6.1\'\n    implementation \'com.google.android.material:material:1.11.0\'\n    implementation \'androidx.constraintlayout:constraintlayout:2.1.4\'\n}\n',
              'app/src/main/AndroidManifest.xml': '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    package="com.capture.clipper">\n\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n\n    <uses-feature android:name="android.hardware.usb.host" android:required="true" />\n\n    <application\n        android:allowBackup="true"\n        android:label="CaptureClip"\n        android:supportsRtl="true"\n        android:theme="@style/Theme.AppCompat.NoActionBar">\n\n        <activity\n            android:name="com.capture.clipper.MainActivity"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n\n        <activity\n            android:name="com.capture.clipper.SettingsActivity"\n            android:exported="false" />\n\n        <service\n            android:name="com.capture.clipper.CaptureService"\n            android:exported="false"\n            android:foregroundServiceType="mediaProjection|camera|microphone" />\n\n    </application>\n</manifest>\n',
              'app/src/main/java/com/capture/clipper/MainActivity.java': 'package com.capture.clipper;\n\nimport android.app.AlertDialog;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.content.SharedPreferences;\nimport android.hardware.usb.UsbDevice;\nimport android.hardware.usb.UsbManager;\nimport android.os.Bundle;\nimport android.text.Editable;\nimport android.text.TextUtils;\nimport android.text.TextWatcher;\nimport android.widget.ArrayAdapter;\nimport android.widget.Button;\nimport android.widget.CheckBox;\nimport android.widget.EditText;\nimport android.widget.ImageButton;\nimport android.widget.SeekBar;\nimport android.widget.Spinner;\nimport android.widget.TextView;\nimport android.widget.Toast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\nimport java.util.HashMap;\n\npublic class MainActivity extends AppCompatActivity implements android.view.SurfaceHolder.Callback {\n    private static final int MIN_BUFFER_SECONDS = 30;\n    private static final int DEFAULT_BUFFER_SECONDS = 30;\n    private static final int DEFAULT_BITRATE_KBPS = 4000;\n\n    private final QualityPreset[] qualityPresets = new QualityPreset[] {\n            new QualityPreset("1080p60 Pro", 1920, 1080, 60, 12000),\n            new QualityPreset("1080p30 Balanced", 1920, 1080, 30, 8000),\n            new QualityPreset("720p60 Fast", 1280, 720, 60, 6000),\n            new QualityPreset("720p30 Stream", 1280, 720, 30, 4000),\n            new QualityPreset("480p30 Low", 854, 480, 30, 2500)\n    };\n\n    private TextView tvCameraStatus;\n    private TextView tvPreviewHud;\n    private TextView tvBufferLabel;\n    private Button btnUseUvc;\n    private ImageButton btnSettings;\n\n    private android.view.SurfaceView captureSurface;\n    private BrowserOverlayView browserSource;\n    private Button btnLoad, btnClip;\n    private EditText inputBitrate, inputUrl;\n    private Spinner selectQuality;\n    private SeekBar seekBuffer;\n    private CheckBox checkBrowserInteract;\n\n    private UsbManager usbManager;\n    private SharedPreferences prefs;\n    private boolean isUvcActive = false;\n    private int replayBufferSeconds = DEFAULT_BUFFER_SECONDS;\n\n    public static final String PREFS = "capture_prefs";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\n        prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE);\n        bindViews();\n        usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);\n        captureSurface.getHolder().addCallback(this);\n\n        setupQualityOptions();\n        loadSavedClipSettings();\n        updateCameraStatus("Phone Camera standby");\n\n        btnUseUvc.setOnClickListener(v -> attemptUvcStart());\n        btnSettings.setOnClickListener(v -> startActivity(new Intent(MainActivity.this, SettingsActivity.class)));\n        btnLoad.setOnClickListener(v -> loadBrowserSource());\n        btnClip.setOnClickListener(v -> queueReplayClip());\n        checkBrowserInteract.setOnCheckedChangeListener((buttonView, isChecked) -> {\n            browserSource.setInteractive(isChecked);\n            Toast.makeText(this, isChecked ? "Browser source interaction on" : "Browser source drag mode on", Toast.LENGTH_SHORT).show();\n            persistClipSettings();\n        });\n        selectQuality.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {\n            @Override\n            public void onItemSelected(android.widget.AdapterView<?> parent, android.view.View view, int position, long id) {\n                QualityPreset preset = qualityPresets[position];\n                inputBitrate.setText(String.valueOf(preset.recommendedBitrateKbps));\n                persistClipSettings();\n                updateClipHud();\n            }\n\n            @Override\n            public void onNothingSelected(android.widget.AdapterView<?> parent) {}\n        });\n        inputBitrate.addTextChangedListener(new TextWatcher() {\n            @Override\n            public void beforeTextChanged(CharSequence s, int start, int count, int after) {}\n\n            @Override\n            public void onTextChanged(CharSequence s, int start, int before, int count) {\n                updateClipHud();\n            }\n\n            @Override\n            public void afterTextChanged(Editable s) {}\n        });\n        seekBuffer.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {\n            @Override\n            public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {\n                replayBufferSeconds = MIN_BUFFER_SECONDS + progress;\n                updateClipHud();\n            }\n\n            @Override\n            public void onStartTrackingTouch(SeekBar seekBar) {}\n\n            @Override\n            public void onStopTrackingTouch(SeekBar seekBar) {\n                persistClipSettings();\n            }\n        });\n    }\n\n    @Override\n    protected void onResume() {\n        super.onResume();\n        if (prefs != null && selectQuality != null) {\n            loadSavedClipSettings();\n        }\n    }\n\n    @Override\n    protected void onPause() {\n        super.onPause();\n        persistClipSettings();\n    }\n\n    private void bindViews() {\n        tvCameraStatus = findViewById(R.id.tvCameraStatus);\n        tvPreviewHud = findViewById(R.id.tvPreviewHud);\n        tvBufferLabel = findViewById(R.id.tvBufferLabel);\n        btnUseUvc = findViewById(R.id.btnUseUvc);\n        btnSettings = findViewById(R.id.btnSettings);\n        captureSurface = findViewById(R.id.captureSurface);\n        browserSource = findViewById(R.id.browserSource);\n        btnLoad = findViewById(R.id.btnLoad);\n        btnClip = findViewById(R.id.btnClip);\n        inputBitrate = findViewById(R.id.inputBitrate);\n        inputUrl = findViewById(R.id.inputUrl);\n        selectQuality = findViewById(R.id.selectQuality);\n        seekBuffer = findViewById(R.id.seekBuffer);\n        checkBrowserInteract = findViewById(R.id.checkBrowserInteract);\n    }\n\n    private void setupQualityOptions() {\n        ArrayAdapter<QualityPreset> adapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, qualityPresets);\n        adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);\n        selectQuality.setAdapter(adapter);\n    }\n\n    private void loadSavedClipSettings() {\n        int qualityIndex = Math.max(0, Math.min(prefs.getInt("quality_index", 2), qualityPresets.length - 1));\n        replayBufferSeconds = Math.max(MIN_BUFFER_SECONDS, Math.min(prefs.getInt("buffer_seconds", DEFAULT_BUFFER_SECONDS), 120));\n        selectQuality.setSelection(qualityIndex);\n        seekBuffer.setProgress(replayBufferSeconds - MIN_BUFFER_SECONDS);\n        inputBitrate.setText(String.valueOf(prefs.getInt("bitrate_kbps", qualityPresets[qualityIndex].recommendedBitrateKbps)));\n        checkBrowserInteract.setChecked(prefs.getBoolean("browser_interact", false));\n        browserSource.setInteractive(checkBrowserInteract.isChecked());\n        updateClipHud();\n    }\n\n    private void persistClipSettings() {\n        prefs.edit()\n                .putInt("quality_index", selectQuality.getSelectedItemPosition())\n                .putInt("buffer_seconds", replayBufferSeconds)\n                .putInt("bitrate_kbps", getBitrateKbps())\n                .putBoolean("browser_interact", checkBrowserInteract.isChecked())\n                .apply();\n    }\n\n    private int getBitrateKbps() {\n        String raw = inputBitrate.getText().toString().trim();\n        if (TextUtils.isEmpty(raw)) return DEFAULT_BITRATE_KBPS;\n        try {\n            return Math.max(1000, Integer.parseInt(raw));\n        } catch (NumberFormatException e) {\n            return DEFAULT_BITRATE_KBPS;\n        }\n    }\n\n    private void loadBrowserSource() {\n        String url = inputUrl.getText().toString().trim();\n        browserSource.loadUrl(url);\n        browserSource.setInteractive(checkBrowserInteract.isChecked());\n        persistClipSettings();\n    }\n\n    private void queueReplayClip() {\n        persistClipSettings();\n        QualityPreset preset = (QualityPreset) selectQuality.getSelectedItem();\n        btnClip.setText("CLIP LAST " + replayBufferSeconds + " SECONDS");\n        Toast.makeText(this, "Queued " + replayBufferSeconds + "s replay at " + preset.label + " / " + getBitrateKbps() + " kbps", Toast.LENGTH_LONG).show();\n    }\n\n    private void updateClipHud() {\n        QualityPreset preset = (QualityPreset) selectQuality.getSelectedItem();\n        if (preset == null) return;\n        tvBufferLabel.setText("Replay buffer: " + replayBufferSeconds + " seconds • est. " + getEstimatedBufferMegabytes() + " MB");\n        tvPreviewHud.setText("Buffer: " + replayBufferSeconds + "s • " + preset.label + " • " + getBitrateKbps() + " kbps • ~" + getEstimatedBufferMegabytes() + " MB");\n        btnClip.setText("CLIP LAST " + replayBufferSeconds + " SECONDS");\n    }\n\n    private int getEstimatedBufferMegabytes() {\n        return Math.max(1, (int) Math.ceil((getBitrateKbps() * replayBufferSeconds) / 8000.0));\n    }\n\n    private void updateCameraStatus(String txt) {\n        tvCameraStatus.setText("Camera: " + txt);\n    }\n\n    private void attemptUvcStart() {\n        HashMap<String, UsbDevice> devices = usbManager.getDeviceList();\n        if (devices == null || devices.isEmpty()) {\n            new AlertDialog.Builder(this)\n                    .setTitle("No capture card found")\n                    .setMessage("Plug in a UVC-compatible capture card, then tap Capture Card again.")\n                    .setPositiveButton("OK", null)\n                    .show();\n            updateCameraStatus("Phone Camera (no UVC)");\n            return;\n        }\n\n        StringBuilder sb = new StringBuilder();\n        for (UsbDevice d : devices.values()) {\n            sb.append(String.format("Vendor: 0x%04x Model: 0x%04x\\n", d.getVendorId(), d.getProductId()));\n            sb.append("Name: ").append(d.getDeviceName()).append(\'\\n\');\n            sb.append("----------------\\n");\n        }\n\n        new AlertDialog.Builder(this)\n                .setTitle("Capture card devices")\n                .setMessage(sb.toString())\n                .setPositiveButton("Use selected card", (dialog, which) -> {\n                    isUvcActive = true;\n                    updateCameraStatus("Capture card active");\n                    Toast.makeText(this, "Capture card selected. Replay buffer is armed.", Toast.LENGTH_LONG).show();\n                })\n                .setNegativeButton("Cancel", null)\n                .show();\n    }\n\n    @Override\n    public void surfaceCreated(android.view.SurfaceHolder holder) {}\n\n    @Override\n    public void surfaceChanged(android.view.SurfaceHolder holder, int format, int width, int height) {}\n\n    @Override\n    public void surfaceDestroyed(android.view.SurfaceHolder holder) {}\n\n    private static class QualityPreset {\n        final String label;\n        final int width;\n        final int height;\n        final int fps;\n        final int recommendedBitrateKbps;\n\n        QualityPreset(String label, int width, int height, int fps, int recommendedBitrateKbps) {\n            this.label = label;\n            this.width = width;\n            this.height = height;\n            this.fps = fps;\n            this.recommendedBitrateKbps = recommendedBitrateKbps;\n        }\n\n        @Override\n        public String toString() {\n            return label + " (" + width + "x" + height + " @ " + fps + "fps)";\n        }\n    }\n}\n',
              'app/src/main/java/com/capture/clipper/SettingsActivity.java': 'package com.capture.clipper;\n\nimport android.content.Context;\nimport android.content.SharedPreferences;\nimport android.graphics.Color;\nimport android.os.Bundle;\nimport android.widget.Button;\nimport android.widget.LinearLayout;\nimport android.widget.RadioButton;\nimport android.widget.RadioGroup;\nimport android.widget.ScrollView;\nimport android.widget.SeekBar;\nimport android.widget.TextView;\nimport android.widget.Toast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\npublic class SettingsActivity extends AppCompatActivity {\n    private static final String[] QUALITY_LABELS = {\n            "1080p60 Pro",\n            "1080p30 Balanced",\n            "720p60 Fast",\n            "720p30 Stream",\n            "480p30 Low"\n    };\n    private SharedPreferences prefs;\n    private int bufferSeconds;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\n        prefs = getSharedPreferences(MainActivity.PREFS, Context.MODE_PRIVATE);\n        bufferSeconds = Math.max(30, Math.min(prefs.getInt("buffer_seconds", 30), 120));\n\n        ScrollView sv = new ScrollView(this);\n        LinearLayout root = new LinearLayout(this);\n        root.setOrientation(LinearLayout.VERTICAL);\n        int pad = (int) (16 * getResources().getDisplayMetrics().density);\n        root.setPadding(pad, pad, pad, pad);\n\n        TextView title = new TextView(this);\n        title.setText("CaptureClip Settings");\n        title.setTextSize(22);\n        title.setTextColor(Color.BLACK);\n        root.addView(title);\n\n        TextView qualityTitle = new TextView(this);\n        qualityTitle.setText("Quality presets");\n        qualityTitle.setTextSize(18);\n        qualityTitle.setPadding(0, 24, 0, 8);\n        root.addView(qualityTitle);\n\n        RadioGroup rg = new RadioGroup(this);\n        rg.setOrientation(RadioGroup.VERTICAL);\n        for (int i = 0; i < QUALITY_LABELS.length; i++) {\n            RadioButton option = new RadioButton(this);\n            option.setText(QUALITY_LABELS[i]);\n            option.setId(1000 + i);\n            rg.addView(option);\n        }\n        rg.check(1000 + Math.max(0, Math.min(prefs.getInt("quality_index", 2), QUALITY_LABELS.length - 1)));\n        root.addView(rg);\n\n        TextView bufferLabel = new TextView(this);\n        bufferLabel.setText("Replay buffer: " + bufferSeconds + " seconds");\n        bufferLabel.setTextSize(18);\n        bufferLabel.setPadding(0, 24, 0, 8);\n        root.addView(bufferLabel);\n\n        SeekBar bufferSeek = new SeekBar(this);\n        bufferSeek.setMax(90);\n        bufferSeek.setProgress(bufferSeconds - 30);\n        bufferSeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {\n            @Override\n            public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {\n                bufferSeconds = 30 + progress;\n                bufferLabel.setText("Replay buffer: " + bufferSeconds + " seconds");\n            }\n\n            @Override\n            public void onStartTrackingTouch(SeekBar seekBar) {}\n\n            @Override\n            public void onStopTrackingTouch(SeekBar seekBar) {}\n        });\n        root.addView(bufferSeek);\n\n        TextView bt = new TextView(this);\n        bt.setText("Bitrate presets (kbps)");\n        bt.setTextSize(18);\n        bt.setPadding(0, 24, 0, 8);\n        root.addView(bt);\n\n        LinearLayout bitrateRow = new LinearLayout(this);\n        bitrateRow.setOrientation(LinearLayout.HORIZONTAL);\n        int[] bitrates = {2500, 4000, 6000, 8000, 12000};\n        for (int bitrate : bitrates) {\n            Button button = new Button(this);\n            button.setText(String.valueOf(bitrate));\n            button.setOnClickListener(v -> {\n                prefs.edit().putInt("bitrate_kbps", bitrate).apply();\n                Toast.makeText(this, bitrate + " kbps selected", Toast.LENGTH_SHORT).show();\n            });\n            bitrateRow.addView(button);\n        }\n        root.addView(bitrateRow);\n\n        TextView hint = new TextView(this);\n        hint.setText("Use 30-120 seconds for replay clips. Higher capture-card resolutions usually need higher bitrate values.");\n        hint.setTextSize(12);\n        hint.setTextColor(Color.DKGRAY);\n        hint.setPadding(0, 8, 0, 8);\n        root.addView(hint);\n\n        Button save = new Button(this);\n        save.setText("Save Settings");\n        save.setOnClickListener(v -> {\n            int idx = Math.max(0, rg.getCheckedRadioButtonId() - 1000);\n            prefs.edit()\n                    .putInt("quality_index", idx)\n                    .putInt("buffer_seconds", bufferSeconds)\n                    .apply();\n            Toast.makeText(this, "Settings saved", Toast.LENGTH_SHORT).show();\n            finish();\n        });\n\n        root.addView(save);\n        sv.addView(root);\n        setContentView(sv);\n    }\n}\n',
              'app/src/main/java/com/capture/clipper/BrowserOverlayView.java': 'package com.capture.clipper;\n\nimport android.annotation.SuppressLint;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.net.Uri;\nimport android.util.AttributeSet;\nimport android.view.LayoutInflater;\nimport android.view.MotionEvent;\nimport android.view.View;\nimport android.webkit.WebResourceRequest;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport android.widget.FrameLayout;\nimport android.widget.ImageButton;\nimport android.widget.Toast;\n\nimport androidx.annotation.NonNull;\n\npublic class BrowserOverlayView extends FrameLayout {\n    private WebView webView;\n    private ImageButton btnOpen, btnClose;\n    private float dX, dY;\n    private boolean interactive;\n\n    public BrowserOverlayView(@NonNull Context context) {\n        super(context);\n        init(context);\n    }\n\n    public BrowserOverlayView(@NonNull Context context, AttributeSet attrs) {\n        super(context, attrs);\n        init(context);\n    }\n\n    @SuppressLint({"SetJavaScriptEnabled", "ClickableViewAccessibility"})\n    private void init(Context ctx) {\n        LayoutInflater.from(ctx).inflate(R.layout.view_browser_overlay, this, true);\n        webView = findViewById(R.id.overlayWebView);\n        btnOpen = findViewById(R.id.btnOverlayOpen);\n        btnClose = findViewById(R.id.btnOverlayClose);\n\n        webView.getSettings().setJavaScriptEnabled(true);\n        webView.getSettings().setDomStorageEnabled(true);\n        webView.setWebViewClient(new WebViewClient() {\n            @Override\n            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {\n                // load inside overlay\n                view.loadUrl(request.getUrl().toString());\n                return true;\n            }\n        });\n\n        btnOpen.setOnClickListener(v -> {\n            String url = webView.getUrl();\n            if (url == null || url.isEmpty()) url = "https://www.google.com";\n            Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));\n            i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n            getContext().startActivity(i);\n        });\n\n        btnClose.setOnClickListener(v -> setVisibility(View.GONE));\n\n        // Dragging is available while interaction mode is off, so taps can control the overlay.\n        this.setOnTouchListener((v, event) -> {\n            if (interactive) return false;\n            switch (event.getAction()) {\n                case MotionEvent.ACTION_DOWN:\n                    dX = v.getX() - event.getRawX();\n                    dY = v.getY() - event.getRawY();\n                    return true;\n                case MotionEvent.ACTION_MOVE:\n                    v.animate().x(event.getRawX() + dX).y(event.getRawY() + dY).setDuration(0).start();\n                    return true;\n                default:\n                    return false;\n            }\n        });\n\n        // long-press to copy current URL\n        webView.setOnLongClickListener(v -> {\n            String url = webView.getUrl();\n            if (url != null && !url.isEmpty()) {\n                android.content.ClipboardManager cm = (android.content.ClipboardManager) getContext().getSystemService(Context.CLIPBOARD_SERVICE);\n                android.content.ClipData clip = android.content.ClipData.newPlainText("Overlay URL", url);\n                cm.setPrimaryClip(clip);\n                Toast.makeText(getContext(), "URL copied", Toast.LENGTH_SHORT).show();\n                return true;\n            }\n            return false;\n        });\n    }\n\n    public void loadUrl(String url) {\n        if (url == null || url.trim().isEmpty()) url = "https://www.google.com";\n        if (!url.startsWith("http://") && !url.startsWith("https://")) {\n            url = "https://" + url;\n        }\n        webView.loadUrl(url);\n        setVisibility(View.VISIBLE);\n    }\n\n    public void setInteractive(boolean interactive) {\n        this.interactive = interactive;\n        webView.setEnabled(interactive);\n        webView.setFocusable(interactive);\n        webView.setFocusableInTouchMode(interactive);\n    }\n}\n',
              'app/src/main/java/com/capture/clipper/CaptureService.java': 'package com.capture.clipper;\n\nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\nimport androidx.annotation.Nullable;\n\npublic class CaptureService extends Service {\n    @Nullable\n    @Override\n    public IBinder onBind(Intent intent) {\n        return null;\n    }\n}\n',
              'app/src/main/res/layout/activity_main.xml': '<?xml version="1.0" encoding="utf-8"?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:app="http://schemas.android.com/apk/res-auto"\n    android:layout_width="match_parent"\n    android:layout_height="match_parent"\n    android:background="@color/background">\n\n    <LinearLayout\n        android:id="@+id/topBar"\n        android:layout_width="0dp"\n        android:layout_height="wrap_content"\n        android:orientation="horizontal"\n        android:gravity="center_vertical"\n        android:padding="12dp"\n        app:layout_constraintTop_toTopOf="parent"\n        app:layout_constraintStart_toStartOf="parent"\n        app:layout_constraintEnd_toEndOf="parent">\n\n        <LinearLayout\n            android:layout_width="0dp"\n            android:layout_height="wrap_content"\n            android:layout_weight="1"\n            android:orientation="vertical">\n\n            <TextView\n                android:id="@+id/tvTitle"\n                android:layout_width="match_parent"\n                android:layout_height="wrap_content"\n                android:text="CaptureClip"\n                android:textColor="@color/onBackground"\n                android:textSize="24sp"\n                android:textStyle="bold" />\n\n            <TextView\n                android:id="@+id/tvCameraStatus"\n                android:layout_width="wrap_content"\n                android:layout_height="wrap_content"\n                android:text="Camera: Unknown"\n                android:textColor="@color/subtleText" />\n        </LinearLayout>\n\n        <ImageButton\n            android:id="@+id/btnSettings"\n            android:layout_width="48dp"\n            android:layout_height="48dp"\n            android:contentDescription="Settings"\n            android:src="@android:drawable/ic_menu_manage"\n            android:backgroundTint="@color/primary"\n            android:tint="@color/onPrimary"\n            android:scaleType="centerInside" />\n    </LinearLayout>\n\n    <FrameLayout\n        android:id="@+id/previewFrame"\n        android:layout_width="0dp"\n        android:layout_height="0dp"\n        android:background="@color/previewBlack"\n        android:elevation="2dp"\n        app:layout_constraintTop_toBottomOf="@id/topBar"\n        app:layout_constraintStart_toStartOf="parent"\n        app:layout_constraintEnd_toEndOf="parent"\n        app:layout_constraintBottom_toTopOf="@id/panelControls"\n        android:layout_marginStart="12dp"\n        android:layout_marginEnd="12dp"\n        android:layout_marginBottom="8dp">\n\n        <SurfaceView\n            android:id="@+id/captureSurface"\n            android:layout_width="match_parent"\n            android:layout_height="match_parent" />\n\n        <VideoView\n            android:id="@+id/previewView"\n            android:layout_width="match_parent"\n            android:layout_height="match_parent"\n            android:visibility="gone" />\n\n        <TextView\n            android:id="@+id/tvPreviewHud"\n            android:layout_width="wrap_content"\n            android:layout_height="wrap_content"\n            android:layout_gravity="top|start"\n            android:layout_margin="12dp"\n            android:background="@color/hudBackground"\n            android:padding="8dp"\n            android:text="Buffer: 30s • 720p60 • 4000 kbps • ~15 MB"\n            android:textColor="@color/onPrimary"\n            android:textStyle="bold" />\n\n        <com.capture.clipper.BrowserOverlayView\n            android:id="@+id/browserSource"\n            android:layout_width="220dp"\n            android:layout_height="180dp"\n            android:layout_gravity="top|end"\n            android:layout_margin="12dp"\n            android:elevation="8dp"\n            android:visibility="gone" />\n    </FrameLayout>\n\n    <LinearLayout\n        android:id="@+id/panelControls"\n        android:layout_width="0dp"\n        android:layout_height="wrap_content"\n        android:orientation="vertical"\n        android:padding="14dp"\n        android:background="@color/surface"\n        app:layout_constraintBottom_toBottomOf="parent"\n        app:layout_constraintStart_toStartOf="parent"\n        app:layout_constraintEnd_toEndOf="parent">\n\n        <LinearLayout\n            android:layout_width="match_parent"\n            android:layout_height="wrap_content"\n            android:orientation="horizontal">\n\n            <Button\n                android:id="@+id/btnUseUvc"\n                android:layout_width="wrap_content"\n                android:layout_height="wrap_content"\n                android:text="Capture Card" />\n\n            <Spinner\n                android:id="@+id/selectQuality"\n                android:layout_width="0dp"\n                android:layout_weight="1"\n                android:layout_height="wrap_content"\n                android:layout_marginStart="8dp" />\n        </LinearLayout>\n\n        <TextView\n            android:id="@+id/tvBufferLabel"\n            android:layout_width="match_parent"\n            android:layout_height="wrap_content"\n            android:layout_marginTop="8dp"\n            android:text="Replay buffer: 30 seconds • est. 15 MB"\n            android:textColor="@color/onBackground" />\n\n        <SeekBar\n            android:id="@+id/seekBuffer"\n            android:layout_width="match_parent"\n            android:layout_height="wrap_content"\n            android:max="90" />\n\n        <LinearLayout\n            android:layout_width="match_parent"\n            android:layout_height="wrap_content"\n            android:orientation="horizontal">\n\n            <EditText\n                android:id="@+id/inputBitrate"\n                android:layout_width="0dp"\n                android:layout_weight="1"\n                android:layout_height="wrap_content"\n                android:hint="Bitrate kbps"\n                android:inputType="number" />\n\n            <CheckBox\n                android:id="@+id/checkBrowserInteract"\n                android:layout_width="wrap_content"\n                android:layout_height="wrap_content"\n                android:layout_marginStart="8dp"\n                android:text="Interact" />\n        </LinearLayout>\n\n        <LinearLayout\n            android:layout_width="match_parent"\n            android:layout_height="wrap_content"\n            android:orientation="horizontal"\n            android:layout_marginTop="8dp">\n\n            <EditText\n                android:id="@+id/inputUrl"\n                android:layout_width="0dp"\n                android:layout_weight="1"\n                android:layout_height="wrap_content"\n                android:hint="Browser source URL" />\n\n            <Button\n                android:id="@+id/btnLoad"\n                android:layout_width="wrap_content"\n                android:layout_height="wrap_content"\n                android:text="ADD" />\n        </LinearLayout>\n\n        <Button\n            android:id="@+id/btnClip"\n            android:layout_width="match_parent"\n            android:layout_height="56dp"\n            android:text="CLIP LAST 30 SECONDS"\n            android:layout_marginTop="10dp"\n            android:backgroundTint="@color/accent"\n            android:textColor="@color/onPrimary" />\n    </LinearLayout>\n</androidx.constraintlayout.widget.ConstraintLayout>\n',
              'app/src/main/res/layout/view_browser_overlay.xml': '<?xml version="1.0" encoding="utf-8"?>\n<merge xmlns:android="http://schemas.android.com/apk/res/android">\n\n    <LinearLayout\n        android:layout_width="match_parent"\n        android:layout_height="match_parent"\n        android:orientation="vertical"\n        android:background="@color/surface"\n        android:padding="6dp">\n\n        <LinearLayout\n            android:layout_width="match_parent"\n            android:layout_height="wrap_content"\n            android:orientation="horizontal"\n            android:gravity="end">\n\n            <ImageButton\n                android:id="@+id/btnOverlayOpen"\n                android:layout_width="36dp"\n                android:layout_height="36dp"\n                android:src="@android:drawable/ic_menu_view"\n                android:contentDescription="Open"\n                android:background="?attr/selectableItemBackgroundBorderless"\n                android:tint="@color/onPrimary" />\n\n            <ImageButton\n                android:id="@+id/btnOverlayClose"\n                android:layout_width="36dp"\n                android:layout_height="36dp"\n                android:src="@android:drawable/ic_menu_close_clear_cancel"\n                android:contentDescription="Close"\n                android:background="?attr/selectableItemBackgroundBorderless"\n                android:tint="@color/onPrimary" />\n\n        </LinearLayout>\n\n        <WebView\n            android:id="@+id/overlayWebView"\n            android:layout_width="match_parent"\n            android:layout_height="0dp"\n            android:layout_weight="1" />\n\n    </LinearLayout>\n\n</merge>\n',
              'app/src/main/res/values/colors.xml': '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <!-- Existing basics -->\n    <color name="black">#FF000000</color>\n    <color name="white">#FFFFFFFF</color>\n\n    <!-- Added missing colors referenced from activity_main.xml and overlays -->\n    <color name="background">#FFF5F7FA</color>\n    <color name="onBackground">#FF121212</color>\n    <color name="primary">#FF0D47A1</color>\n    <color name="onPrimary">#FFFFFFFF</color>\n    <color name="surface">#FFFFFFFF</color>\n\n    <!-- Preset swatches -->\n    <color name="quality_720p60">#FF2E7D32</color>\n    <color name="quality_720p30">#FF1565C0</color>\n    <color name="quality_480p30">#FFF57F17</color>\n    <color name="subtleText">#FF536273</color>\n    <color name="previewBlack">#FF05070A</color>\n    <color name="hudBackground">#99000000</color>\n    <color name="accent">#FFE53935</color>\n</resources>\n',
              'app/src/main/res/values/styles.xml': '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <!-- Base application theme -->\n    <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">\n        <!-- Customize your theme here -->\n        <item name="colorPrimary">#FF0055</item>\n        <item name="colorSecondary">#00FFFF</item>\n    </style>\n</resources>\n',
              'app/src/main/res/values/strings.xml': '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">CaptureClip</string>\n</resources>\n',
              'app/src/main/res/values/arrays.xml': '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string-array name="imValues">\n        <item>1080p (Pro Quality)</item>\n        <item>720p (Fast Stream)</item>\n        <item>480p (Low Bandwidth)</item>\n    </string-array>\n</resources>\n',
              'scripts/bootstrap_captureclip_project.py': '#!/usr/bin/env python3\n"""Bootstrap the CaptureClip Android project from a mobile GitHub Codespace.\n\nUsage from an empty repo/Codespace:\n  python3 scripts/bootstrap_captureclip_project.py --commit --push\n\nIf you are pasting this into Codespaces, create it first:\n  mkdir -p scripts\n  cat > scripts/bootstrap_captureclip_project.py\n  # paste this file, press Ctrl+D, then run:\n  python3 scripts/bootstrap_captureclip_project.py --commit --push\n"""\n\nfrom __future__ import annotations\n\nimport argparse\nimport subprocess\nfrom pathlib import Path\n\nPROJECT_FILES = {\n    \'.github/workflows/build.yml\': \'name: Build APK\\n\\non:\\n  workflow_dispatch:\\n  push:\\n    branches: [ "main" ]\\n  pull_request:\\n    branches: [ "main" ]\\n\\njobs:\\n  build:\\n    runs-on: ubuntu-latest\\n\\n    steps:\\n    - name: Checkout Repository\\n      uses: actions/checkout@v4\\n\\n    - name: Set up JDK 17\\n      uses: actions/setup-java@v4\\n      with:\\n        java-version: \\\'17\\\'\\n        distribution: \\\'temurin\\\'\\n\\n    - name: Setup Gradle\\n      uses: gradle/actions/setup-gradle@v4\\n      with:\\n        gradle-version: \\\'8.2\\\'\\n\\n    - name: Build with Gradle\\n      run: gradle assembleDebug\\n\\n    - name: Upload Finished APK\\n      uses: actions/upload-artifact@v4\\n      with:\\n        name: app-debug\\n        path: app/build/outputs/apk/debug/\\n\',\n    \'codemagic.yaml\': \'workflows:\\n  default:\\n    name: Build APK\\n    scripts:\\n      - gradle assembleDebug\\n    artifacts:\\n      - app/build/outputs/apk/debug/*.apk\\n\',\n    \'settings.gradle\': "include \':app\'\\n",\n    \'build.gradle\': "buildscript {\\n    repositories {\\n        google()\\n        mavenCentral()\\n    }\\n    dependencies {\\n        classpath \'com.android.tools.build:gradle:8.2.2\'\\n    }\\n}\\n\\nallprojects {\\n    repositories {\\n        google()\\n        mavenCentral()\\n    }\\n}\\n\\ntask clean(type: Delete) {\\n    delete rootProject.buildDir\\n}\\n",\n    \'gradle.properties\': \'android.useAndroidX=true\\nandroid.enableJetifier=true\\n\\n\',\n    \'app/build.gradle\': \'plugins {\\n    id \\\'com.android.application\\\'\\n}\\n\\nandroid {\\n    namespace \\\'com.capture.clipper\\\'\\n    compileSdk 34\\n\\n    defaultConfig {\\n        applicationId "com.capture.clipper"\\n        minSdk 23\\n        targetSdk 34\\n        versionCode 1\\n        versionName "1.0"\\n    }\\n\\n    buildTypes {\\n        release {\\n            minifyEnabled false\\n            proguardFiles getDefaultProguardFile(\\\'proguard-android-optimize.txt\\\'), \\\'proguard-rules.pro\\\'\\n        }\\n    }\\n\\n    lint {\\n        checkReleaseBuilds false\\n        abortOnError false\\n    }\\n}\\n\\ndependencies {\\n    implementation \\\'androidx.appcompat:appcompat:1.6.1\\\'\\n    implementation \\\'com.google.android.material:material:1.11.0\\\'\\n    implementation \\\'androidx.constraintlayout:constraintlayout:2.1.4\\\'\\n}\\n\',\n    \'app/src/main/AndroidManifest.xml\': \'<?xml version="1.0" encoding="utf-8"?>\\n<manifest xmlns:android="http://schemas.android.com/apk/res/android"\\n    package="com.capture.clipper">\\n\\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n    <uses-permission android:name="android.permission.CAMERA" />\\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\\n\\n    <uses-feature android:name="android.hardware.usb.host" android:required="true" />\\n\\n    <application\\n        android:allowBackup="true"\\n        android:label="CaptureClip"\\n        android:supportsRtl="true"\\n        android:theme="@style/Theme.AppCompat.NoActionBar">\\n\\n        <activity\\n            android:name="com.capture.clipper.MainActivity"\\n            android:exported="true">\\n            <intent-filter>\\n                <action android:name="android.intent.action.MAIN" />\\n                <category android:name="android.intent.category.LAUNCHER" />\\n            </intent-filter>\\n        </activity>\\n\\n        <activity\\n            android:name="com.capture.clipper.SettingsActivity"\\n            android:exported="false" />\\n\\n        <service\\n            android:name="com.capture.clipper.CaptureService"\\n            android:exported="false"\\n            android:foregroundServiceType="mediaProjection|camera|microphone" />\\n\\n    </application>\\n</manifest>\\n\',\n    \'app/src/main/java/com/capture/clipper/MainActivity.java\': \'package com.capture.clipper;\\n\\nimport android.app.AlertDialog;\\nimport android.content.Context;\\nimport android.content.Intent;\\nimport android.content.SharedPreferences;\\nimport android.hardware.usb.UsbDevice;\\nimport android.hardware.usb.UsbManager;\\nimport android.os.Bundle;\\nimport android.text.Editable;\\nimport android.text.TextUtils;\\nimport android.text.TextWatcher;\\nimport android.widget.ArrayAdapter;\\nimport android.widget.Button;\\nimport android.widget.CheckBox;\\nimport android.widget.EditText;\\nimport android.widget.ImageButton;\\nimport android.widget.SeekBar;\\nimport android.widget.Spinner;\\nimport android.widget.TextView;\\nimport android.widget.Toast;\\n\\nimport androidx.appcompat.app.AppCompatActivity;\\n\\nimport java.util.HashMap;\\n\\npublic class MainActivity extends AppCompatActivity implements android.view.SurfaceHolder.Callback {\\n    private static final int MIN_BUFFER_SECONDS = 30;\\n    private static final int DEFAULT_BUFFER_SECONDS = 30;\\n    private static final int DEFAULT_BITRATE_KBPS = 4000;\\n\\n    private final QualityPreset[] qualityPresets = new QualityPreset[] {\\n            new QualityPreset("1080p60 Pro", 1920, 1080, 60, 12000),\\n            new QualityPreset("1080p30 Balanced", 1920, 1080, 30, 8000),\\n            new QualityPreset("720p60 Fast", 1280, 720, 60, 6000),\\n            new QualityPreset("720p30 Stream", 1280, 720, 30, 4000),\\n            new QualityPreset("480p30 Low", 854, 480, 30, 2500)\\n    };\\n\\n    private TextView tvCameraStatus;\\n    private TextView tvPreviewHud;\\n    private TextView tvBufferLabel;\\n    private Button btnUseUvc;\\n    private ImageButton btnSettings;\\n\\n    private android.view.SurfaceView captureSurface;\\n    private BrowserOverlayView browserSource;\\n    private Button btnLoad, btnClip;\\n    private EditText inputBitrate, inputUrl;\\n    private Spinner selectQuality;\\n    private SeekBar seekBuffer;\\n    private CheckBox checkBrowserInteract;\\n\\n    private UsbManager usbManager;\\n    private SharedPreferences prefs;\\n    private boolean isUvcActive = false;\\n    private int replayBufferSeconds = DEFAULT_BUFFER_SECONDS;\\n\\n    public static final String PREFS = "capture_prefs";\\n\\n    @Override\\n    protected void onCreate(Bundle savedInstanceState) {\\n        super.onCreate(savedInstanceState);\\n        setContentView(R.layout.activity_main);\\n\\n        prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE);\\n        bindViews();\\n        usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);\\n        captureSurface.getHolder().addCallback(this);\\n\\n        setupQualityOptions();\\n        loadSavedClipSettings();\\n        updateCameraStatus("Phone Camera standby");\\n\\n        btnUseUvc.setOnClickListener(v -> attemptUvcStart());\\n        btnSettings.setOnClickListener(v -> startActivity(new Intent(MainActivity.this, SettingsActivity.class)));\\n        btnLoad.setOnClickListener(v -> loadBrowserSource());\\n        btnClip.setOnClickListener(v -> queueReplayClip());\\n        checkBrowserInteract.setOnCheckedChangeListener((buttonView, isChecked) -> {\\n            browserSource.setInteractive(isChecked);\\n            Toast.makeText(this, isChecked ? "Browser source interaction on" : "Browser source drag mode on", Toast.LENGTH_SHORT).show();\\n            persistClipSettings();\\n        });\\n        selectQuality.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {\\n            @Override\\n            public void onItemSelected(android.widget.AdapterView<?> parent, android.view.View view, int position, long id) {\\n                QualityPreset preset = qualityPresets[position];\\n                inputBitrate.setText(String.valueOf(preset.recommendedBitrateKbps));\\n                persistClipSettings();\\n                updateClipHud();\\n            }\\n\\n            @Override\\n            public void onNothingSelected(android.widget.AdapterView<?> parent) {}\\n        });\\n        inputBitrate.addTextChangedListener(new TextWatcher() {\\n            @Override\\n            public void beforeTextChanged(CharSequence s, int start, int count, int after) {}\\n\\n            @Override\\n            public void onTextChanged(CharSequence s, int start, int before, int count) {\\n                updateClipHud();\\n            }\\n\\n            @Override\\n            public void afterTextChanged(Editable s) {}\\n        });\\n        seekBuffer.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {\\n            @Override\\n            public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {\\n                replayBufferSeconds = MIN_BUFFER_SECONDS + progress;\\n                updateClipHud();\\n            }\\n\\n            @Override\\n            public void onStartTrackingTouch(SeekBar seekBar) {}\\n\\n            @Override\\n            public void onStopTrackingTouch(SeekBar seekBar) {\\n                persistClipSettings();\\n            }\\n        });\\n    }\\n\\n    @Override\\n    protected void onResume() {\\n        super.onResume();\\n        if (prefs != null && selectQuality != null) {\\n            loadSavedClipSettings();\\n        }\\n    }\\n\\n    @Override\\n    protected void onPause() {\\n        super.onPause();\\n        persistClipSettings();\\n    }\\n\\n    private void bindViews() {\\n        tvCameraStatus = findViewById(R.id.tvCameraStatus);\\n        tvPreviewHud = findViewById(R.id.tvPreviewHud);\\n        tvBufferLabel = findViewById(R.id.tvBufferLabel);\\n        btnUseUvc = findViewById(R.id.btnUseUvc);\\n        btnSettings = findViewById(R.id.btnSettings);\\n        captureSurface = findViewById(R.id.captureSurface);\\n        browserSource = findViewById(R.id.browserSource);\\n        btnLoad = findViewById(R.id.btnLoad);\\n        btnClip = findViewById(R.id.btnClip);\\n        inputBitrate = findViewById(R.id.inputBitrate);\\n        inputUrl = findViewById(R.id.inputUrl);\\n        selectQuality = findViewById(R.id.selectQuality);\\n        seekBuffer = findViewById(R.id.seekBuffer);\\n        checkBrowserInteract = findViewById(R.id.checkBrowserInteract);\\n    }\\n\\n    private void setupQualityOptions() {\\n        ArrayAdapter<QualityPreset> adapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, qualityPresets);\\n        adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);\\n        selectQuality.setAdapter(adapter);\\n    }\\n\\n    private void loadSavedClipSettings() {\\n        int qualityIndex = Math.max(0, Math.min(prefs.getInt("quality_index", 2), qualityPresets.length - 1));\\n        replayBufferSeconds = Math.max(MIN_BUFFER_SECONDS, Math.min(prefs.getInt("buffer_seconds", DEFAULT_BUFFER_SECONDS), 120));\\n        selectQuality.setSelection(qualityIndex);\\n        seekBuffer.setProgress(replayBufferSeconds - MIN_BUFFER_SECONDS);\\n        inputBitrate.setText(String.valueOf(prefs.getInt("bitrate_kbps", qualityPresets[qualityIndex].recommendedBitrateKbps)));\\n        checkBrowserInteract.setChecked(prefs.getBoolean("browser_interact", false));\\n        browserSource.setInteractive(checkBrowserInteract.isChecked());\\n        updateClipHud();\\n    }\\n\\n    private void persistClipSettings() {\\n        prefs.edit()\\n                .putInt("quality_index", selectQuality.getSelectedItemPosition())\\n                .putInt("buffer_seconds", replayBufferSeconds)\\n                .putInt("bitrate_kbps", getBitrateKbps())\\n                .putBoolean("browser_interact", checkBrowserInteract.isChecked())\\n                .apply();\\n    }\\n\\n    private int getBitrateKbps() {\\n        String raw = inputBitrate.getText().toString().trim();\\n        if (TextUtils.isEmpty(raw)) return DEFAULT_BITRATE_KBPS;\\n        try {\\n            return Math.max(1000, Integer.parseInt(raw));\\n        } catch (NumberFormatException e) {\\n            return DEFAULT_BITRATE_KBPS;\\n        }\\n    }\\n\\n    private void loadBrowserSource() {\\n        String url = inputUrl.getText().toString().trim();\\n        browserSource.loadUrl(url);\\n        browserSource.setInteractive(checkBrowserInteract.isChecked());\\n        persistClipSettings();\\n    }\\n\\n    private void queueReplayClip() {\\n        persistClipSettings();\\n        QualityPreset preset = (QualityPreset) selectQuality.getSelectedItem();\\n        btnClip.setText("CLIP LAST " + replayBufferSeconds + " SECONDS");\\n        Toast.makeText(this, "Queued " + replayBufferSeconds + "s replay at " + preset.label + " / " + getBitrateKbps() + " kbps", Toast.LENGTH_LONG).show();\\n    }\\n\\n    private void updateClipHud() {\\n        QualityPreset preset = (QualityPreset) selectQuality.getSelectedItem();\\n        if (preset == null) return;\\n        tvBufferLabel.setText("Replay buffer: " + replayBufferSeconds + " seconds • est. " + getEstimatedBufferMegabytes() + " MB");\\n        tvPreviewHud.setText("Buffer: " + replayBufferSeconds + "s • " + preset.label + " • " + getBitrateKbps() + " kbps • ~" + getEstimatedBufferMegabytes() + " MB");\\n        btnClip.setText("CLIP LAST " + replayBufferSeconds + " SECONDS");\\n    }\\n\\n    private int getEstimatedBufferMegabytes() {\\n        return Math.max(1, (int) Math.ceil((getBitrateKbps() * replayBufferSeconds) / 8000.0));\\n    }\\n\\n    private void updateCameraStatus(String txt) {\\n        tvCameraStatus.setText("Camera: " + txt);\\n    }\\n\\n    private void attemptUvcStart() {\\n        HashMap<String, UsbDevice> devices = usbManager.getDeviceList();\\n        if (devices == null || devices.isEmpty()) {\\n            new AlertDialog.Builder(this)\\n                    .setTitle("No capture card found")\\n                    .setMessage("Plug in a UVC-compatible capture card, then tap Capture Card again.")\\n                    .setPositiveButton("OK", null)\\n                    .show();\\n            updateCameraStatus("Phone Camera (no UVC)");\\n            return;\\n        }\\n\\n        StringBuilder sb = new StringBuilder();\\n        for (UsbDevice d : devices.values()) {\\n            sb.append(String.format("Vendor: 0x%04x Model: 0x%04x\\\\n", d.getVendorId(), d.getProductId()));\\n            sb.append("Name: ").append(d.getDeviceName()).append(\\\'\\\\n\\\');\\n            sb.append("----------------\\\\n");\\n        }\\n\\n        new AlertDialog.Builder(this)\\n                .setTitle("Capture card devices")\\n                .setMessage(sb.toString())\\n                .setPositiveButton("Use selected card", (dialog, which) -> {\\n                    isUvcActive = true;\\n                    updateCameraStatus("Capture card active");\\n                    Toast.makeText(this, "Capture card selected. Replay buffer is armed.", Toast.LENGTH_LONG).show();\\n                })\\n                .setNegativeButton("Cancel", null)\\n                .show();\\n    }\\n\\n    @Override\\n    public void surfaceCreated(android.view.SurfaceHolder holder) {}\\n\\n    @Override\\n    public void surfaceChanged(android.view.SurfaceHolder holder, int format, int width, int height) {}\\n\\n    @Override\\n    public void surfaceDestroyed(android.view.SurfaceHolder holder) {}\\n\\n    private static class QualityPreset {\\n        final String label;\\n        final int width;\\n        final int height;\\n        final int fps;\\n        final int recommendedBitrateKbps;\\n\\n        QualityPreset(String label, int width, int height, int fps, int recommendedBitrateKbps) {\\n            this.label = label;\\n            this.width = width;\\n            this.height = height;\\n            this.fps = fps;\\n            this.recommendedBitrateKbps = recommendedBitrateKbps;\\n        }\\n\\n        @Override\\n        public String toString() {\\n            return label + " (" + width + "x" + height + " @ " + fps + "fps)";\\n        }\\n    }\\n}\\n\',\n    \'app/src/main/java/com/capture/clipper/SettingsActivity.java\': \'package com.capture.clipper;\\n\\nimport android.content.Context;\\nimport android.content.SharedPreferences;\\nimport android.graphics.Color;\\nimport android.os.Bundle;\\nimport android.widget.Button;\\nimport android.widget.LinearLayout;\\nimport android.widget.RadioButton;\\nimport android.widget.RadioGroup;\\nimport android.widget.ScrollView;\\nimport android.widget.SeekBar;\\nimport android.widget.TextView;\\nimport android.widget.Toast;\\n\\nimport androidx.appcompat.app.AppCompatActivity;\\n\\npublic class SettingsActivity extends AppCompatActivity {\\n    private static final String[] QUALITY_LABELS = {\\n            "1080p60 Pro",\\n            "1080p30 Balanced",\\n            "720p60 Fast",\\n            "720p30 Stream",\\n            "480p30 Low"\\n    };\\n    private SharedPreferences prefs;\\n    private int bufferSeconds;\\n\\n    @Override\\n    protected void onCreate(Bundle savedInstanceState) {\\n        super.onCreate(savedInstanceState);\\n\\n        prefs = getSharedPreferences(MainActivity.PREFS, Context.MODE_PRIVATE);\\n        bufferSeconds = Math.max(30, Math.min(prefs.getInt("buffer_seconds", 30), 120));\\n\\n        ScrollView sv = new ScrollView(this);\\n        LinearLayout root = new LinearLayout(this);\\n        root.setOrientation(LinearLayout.VERTICAL);\\n        int pad = (int) (16 * getResources().getDisplayMetrics().density);\\n        root.setPadding(pad, pad, pad, pad);\\n\\n        TextView title = new TextView(this);\\n        title.setText("CaptureClip Settings");\\n        title.setTextSize(22);\\n        title.setTextColor(Color.BLACK);\\n        root.addView(title);\\n\\n        TextView qualityTitle = new TextView(this);\\n        qualityTitle.setText("Quality presets");\\n        qualityTitle.setTextSize(18);\\n        qualityTitle.setPadding(0, 24, 0, 8);\\n        root.addView(qualityTitle);\\n\\n        RadioGroup rg = new RadioGroup(this);\\n        rg.setOrientation(RadioGroup.VERTICAL);\\n        for (int i = 0; i < QUALITY_LABELS.length; i++) {\\n            RadioButton option = new RadioButton(this);\\n            option.setText(QUALITY_LABELS[i]);\\n            option.setId(1000 + i);\\n            rg.addView(option);\\n        }\\n        rg.check(1000 + Math.max(0, Math.min(prefs.getInt("quality_index", 2), QUALITY_LABELS.length - 1)));\\n        root.addView(rg);\\n\\n        TextView bufferLabel = new TextView(this);\\n        bufferLabel.setText("Replay buffer: " + bufferSeconds + " seconds");\\n        bufferLabel.setTextSize(18);\\n        bufferLabel.setPadding(0, 24, 0, 8);\\n        root.addView(bufferLabel);\\n\\n        SeekBar bufferSeek = new SeekBar(this);\\n        bufferSeek.setMax(90);\\n        bufferSeek.setProgress(bufferSeconds - 30);\\n        bufferSeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {\\n            @Override\\n            public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {\\n                bufferSeconds = 30 + progress;\\n                bufferLabel.setText("Replay buffer: " + bufferSeconds + " seconds");\\n            }\\n\\n            @Override\\n            public void onStartTrackingTouch(SeekBar seekBar) {}\\n\\n            @Override\\n            public void onStopTrackingTouch(SeekBar seekBar) {}\\n        });\\n        root.addView(bufferSeek);\\n\\n        TextView bt = new TextView(this);\\n        bt.setText("Bitrate presets (kbps)");\\n        bt.setTextSize(18);\\n        bt.setPadding(0, 24, 0, 8);\\n        root.addView(bt);\\n\\n        LinearLayout bitrateRow = new LinearLayout(this);\\n        bitrateRow.setOrientation(LinearLayout.HORIZONTAL);\\n        int[] bitrates = {2500, 4000, 6000, 8000, 12000};\\n        for (int bitrate : bitrates) {\\n            Button button = new Button(this);\\n            button.setText(String.valueOf(bitrate));\\n            button.setOnClickListener(v -> {\\n                prefs.edit().putInt("bitrate_kbps", bitrate).apply();\\n                Toast.makeText(this, bitrate + " kbps selected", Toast.LENGTH_SHORT).show();\\n            });\\n            bitrateRow.addView(button);\\n        }\\n        root.addView(bitrateRow);\\n\\n        TextView hint = new TextView(this);\\n        hint.setText("Use 30-120 seconds for replay clips. Higher capture-card resolutions usually need higher bitrate values.");\\n        hint.setTextSize(12);\\n        hint.setTextColor(Color.DKGRAY);\\n        hint.setPadding(0, 8, 0, 8);\\n        root.addView(hint);\\n\\n        Button save = new Button(this);\\n        save.setText("Save Settings");\\n        save.setOnClickListener(v -> {\\n            int idx = Math.max(0, rg.getCheckedRadioButtonId() - 1000);\\n            prefs.edit()\\n                    .putInt("quality_index", idx)\\n                    .putInt("buffer_seconds", bufferSeconds)\\n                    .apply();\\n            Toast.makeText(this, "Settings saved", Toast.LENGTH_SHORT).show();\\n            finish();\\n        });\\n\\n        root.addView(save);\\n        sv.addView(root);\\n        setContentView(sv);\\n    }\\n}\\n\',\n    \'app/src/main/java/com/capture/clipper/BrowserOverlayView.java\': \'package com.capture.clipper;\\n\\nimport android.annotation.SuppressLint;\\nimport android.content.Context;\\nimport android.content.Intent;\\nimport android.net.Uri;\\nimport android.util.AttributeSet;\\nimport android.view.LayoutInflater;\\nimport android.view.MotionEvent;\\nimport android.view.View;\\nimport android.webkit.WebResourceRequest;\\nimport android.webkit.WebView;\\nimport android.webkit.WebViewClient;\\nimport android.widget.FrameLayout;\\nimport android.widget.ImageButton;\\nimport android.widget.Toast;\\n\\nimport androidx.annotation.NonNull;\\n\\npublic class BrowserOverlayView extends FrameLayout {\\n    private WebView webView;\\n    private ImageButton btnOpen, btnClose;\\n    private float dX, dY;\\n    private boolean interactive;\\n\\n    public BrowserOverlayView(@NonNull Context context) {\\n        super(context);\\n        init(context);\\n    }\\n\\n    public BrowserOverlayView(@NonNull Context context, AttributeSet attrs) {\\n        super(context, attrs);\\n        init(context);\\n    }\\n\\n    @SuppressLint({"SetJavaScriptEnabled", "ClickableViewAccessibility"})\\n    private void init(Context ctx) {\\n        LayoutInflater.from(ctx).inflate(R.layout.view_browser_overlay, this, true);\\n        webView = findViewById(R.id.overlayWebView);\\n        btnOpen = findViewById(R.id.btnOverlayOpen);\\n        btnClose = findViewById(R.id.btnOverlayClose);\\n\\n        webView.getSettings().setJavaScriptEnabled(true);\\n        webView.getSettings().setDomStorageEnabled(true);\\n        webView.setWebViewClient(new WebViewClient() {\\n            @Override\\n            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {\\n                // load inside overlay\\n                view.loadUrl(request.getUrl().toString());\\n                return true;\\n            }\\n        });\\n\\n        btnOpen.setOnClickListener(v -> {\\n            String url = webView.getUrl();\\n            if (url == null || url.isEmpty()) url = "https://www.google.com";\\n            Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));\\n            i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\\n            getContext().startActivity(i);\\n        });\\n\\n        btnClose.setOnClickListener(v -> setVisibility(View.GONE));\\n\\n        // Dragging is available while interaction mode is off, so taps can control the overlay.\\n        this.setOnTouchListener((v, event) -> {\\n            if (interactive) return false;\\n            switch (event.getAction()) {\\n                case MotionEvent.ACTION_DOWN:\\n                    dX = v.getX() - event.getRawX();\\n                    dY = v.getY() - event.getRawY();\\n                    return true;\\n                case MotionEvent.ACTION_MOVE:\\n                    v.animate().x(event.getRawX() + dX).y(event.getRawY() + dY).setDuration(0).start();\\n                    return true;\\n                default:\\n                    return false;\\n            }\\n        });\\n\\n        // long-press to copy current URL\\n        webView.setOnLongClickListener(v -> {\\n            String url = webView.getUrl();\\n            if (url != null && !url.isEmpty()) {\\n                android.content.ClipboardManager cm = (android.content.ClipboardManager) getContext().getSystemService(Context.CLIPBOARD_SERVICE);\\n                android.content.ClipData clip = android.content.ClipData.newPlainText("Overlay URL", url);\\n                cm.setPrimaryClip(clip);\\n                Toast.makeText(getContext(), "URL copied", Toast.LENGTH_SHORT).show();\\n                return true;\\n            }\\n            return false;\\n        });\\n    }\\n\\n    public void loadUrl(String url) {\\n        if (url == null || url.trim().isEmpty()) url = "https://www.google.com";\\n        if (!url.startsWith("http://") && !url.startsWith("https://")) {\\n            url = "https://" + url;\\n        }\\n        webView.loadUrl(url);\\n        setVisibility(View.VISIBLE);\\n    }\\n\\n    public void setInteractive(boolean interactive) {\\n        this.interactive = interactive;\\n        webView.setEnabled(interactive);\\n        webView.setFocusable(interactive);\\n        webView.setFocusableInTouchMode(interactive);\\n    }\\n}\\n\',\n    \'app/src/main/java/com/capture/clipper/CaptureService.java\': \'package com.capture.clipper;\\n\\nimport android.app.Service;\\nimport android.content.Intent;\\nimport android.os.IBinder;\\n\\nimport androidx.annotation.Nullable;\\n\\npublic class CaptureService extends Service {\\n    @Nullable\\n    @Override\\n    public IBinder onBind(Intent intent) {\\n        return null;\\n    }\\n}\\n\',\n    \'app/src/main/res/layout/activity_main.xml\': \'<?xml version="1.0" encoding="utf-8"?>\\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"\\n    xmlns:app="http://schemas.android.com/apk/res-auto"\\n    android:layout_width="match_parent"\\n    android:layout_height="match_parent"\\n    android:background="@color/background">\\n\\n    <LinearLayout\\n        android:id="@+id/topBar"\\n        android:layout_width="0dp"\\n        android:layout_height="wrap_content"\\n        android:orientation="horizontal"\\n        android:gravity="center_vertical"\\n        android:padding="12dp"\\n        app:layout_constraintTop_toTopOf="parent"\\n        app:layout_constraintStart_toStartOf="parent"\\n        app:layout_constraintEnd_toEndOf="parent">\\n\\n        <LinearLayout\\n            android:layout_width="0dp"\\n            android:layout_height="wrap_content"\\n            android:layout_weight="1"\\n            android:orientation="vertical">\\n\\n            <TextView\\n                android:id="@+id/tvTitle"\\n                android:layout_width="match_parent"\\n                android:layout_height="wrap_content"\\n                android:text="CaptureClip"\\n                android:textColor="@color/onBackground"\\n                android:textSize="24sp"\\n                android:textStyle="bold" />\\n\\n            <TextView\\n                android:id="@+id/tvCameraStatus"\\n                android:layout_width="wrap_content"\\n                android:layout_height="wrap_content"\\n                android:text="Camera: Unknown"\\n                android:textColor="@color/subtleText" />\\n        </LinearLayout>\\n\\n        <ImageButton\\n            android:id="@+id/btnSettings"\\n            android:layout_width="48dp"\\n            android:layout_height="48dp"\\n            android:contentDescription="Settings"\\n            android:src="@android:drawable/ic_menu_manage"\\n            android:backgroundTint="@color/primary"\\n            android:tint="@color/onPrimary"\\n            android:scaleType="centerInside" />\\n    </LinearLayout>\\n\\n    <FrameLayout\\n        android:id="@+id/previewFrame"\\n        android:layout_width="0dp"\\n        android:layout_height="0dp"\\n        android:background="@color/previewBlack"\\n        android:elevation="2dp"\\n        app:layout_constraintTop_toBottomOf="@id/topBar"\\n        app:layout_constraintStart_toStartOf="parent"\\n        app:layout_constraintEnd_toEndOf="parent"\\n        app:layout_constraintBottom_toTopOf="@id/panelControls"\\n        android:layout_marginStart="12dp"\\n        android:layout_marginEnd="12dp"\\n        android:layout_marginBottom="8dp">\\n\\n        <SurfaceView\\n            android:id="@+id/captureSurface"\\n            android:layout_width="match_parent"\\n            android:layout_height="match_parent" />\\n\\n        <VideoView\\n            android:id="@+id/previewView"\\n            android:layout_width="match_parent"\\n            android:layout_height="match_parent"\\n            android:visibility="gone" />\\n\\n        <TextView\\n            android:id="@+id/tvPreviewHud"\\n            android:layout_width="wrap_content"\\n            android:layout_height="wrap_content"\\n            android:layout_gravity="top|start"\\n            android:layout_margin="12dp"\\n            android:background="@color/hudBackground"\\n            android:padding="8dp"\\n            android:text="Buffer: 30s • 720p60 • 4000 kbps • ~15 MB"\\n            android:textColor="@color/onPrimary"\\n            android:textStyle="bold" />\\n\\n        <com.capture.clipper.BrowserOverlayView\\n            android:id="@+id/browserSource"\\n            android:layout_width="220dp"\\n            android:layout_height="180dp"\\n            android:layout_gravity="top|end"\\n            android:layout_margin="12dp"\\n            android:elevation="8dp"\\n            android:visibility="gone" />\\n    </FrameLayout>\\n\\n    <LinearLayout\\n        android:id="@+id/panelControls"\\n        android:layout_width="0dp"\\n        android:layout_height="wrap_content"\\n        android:orientation="vertical"\\n        android:padding="14dp"\\n        android:background="@color/surface"\\n        app:layout_constraintBottom_toBottomOf="parent"\\n        app:layout_constraintStart_toStartOf="parent"\\n        app:layout_constraintEnd_toEndOf="parent">\\n\\n        <LinearLayout\\n            android:layout_width="match_parent"\\n            android:layout_height="wrap_content"\\n            android:orientation="horizontal">\\n\\n            <Button\\n                android:id="@+id/btnUseUvc"\\n                android:layout_width="wrap_content"\\n                android:layout_height="wrap_content"\\n                android:text="Capture Card" />\\n\\n            <Spinner\\n                android:id="@+id/selectQuality"\\n                android:layout_width="0dp"\\n                android:layout_weight="1"\\n                android:layout_height="wrap_content"\\n                android:layout_marginStart="8dp" />\\n        </LinearLayout>\\n\\n        <TextView\\n            android:id="@+id/tvBufferLabel"\\n            android:layout_width="match_parent"\\n            android:layout_height="wrap_content"\\n            android:layout_marginTop="8dp"\\n            android:text="Replay buffer: 30 seconds • est. 15 MB"\\n            android:textColor="@color/onBackground" />\\n\\n        <SeekBar\\n            android:id="@+id/seekBuffer"\\n            android:layout_width="match_parent"\\n            android:layout_height="wrap_content"\\n            android:max="90" />\\n\\n        <LinearLayout\\n            android:layout_width="match_parent"\\n            android:layout_height="wrap_content"\\n            android:orientation="horizontal">\\n\\n            <EditText\\n                android:id="@+id/inputBitrate"\\n                android:layout_width="0dp"\\n                android:layout_weight="1"\\n                android:layout_height="wrap_content"\\n                android:hint="Bitrate kbps"\\n                android:inputType="number" />\\n\\n            <CheckBox\\n                android:id="@+id/checkBrowserInteract"\\n                android:layout_width="wrap_content"\\n                android:layout_height="wrap_content"\\n                android:layout_marginStart="8dp"\\n                android:text="Interact" />\\n        </LinearLayout>\\n\\n        <LinearLayout\\n            android:layout_width="match_parent"\\n            android:layout_height="wrap_content"\\n            android:orientation="horizontal"\\n            android:layout_marginTop="8dp">\\n\\n            <EditText\\n                android:id="@+id/inputUrl"\\n                android:layout_width="0dp"\\n                android:layout_weight="1"\\n                android:layout_height="wrap_content"\\n                android:hint="Browser source URL" />\\n\\n            <Button\\n                android:id="@+id/btnLoad"\\n                android:layout_width="wrap_content"\\n                android:layout_height="wrap_content"\\n                android:text="ADD" />\\n        </LinearLayout>\\n\\n        <Button\\n            android:id="@+id/btnClip"\\n            android:layout_width="match_parent"\\n            android:layout_height="56dp"\\n            android:text="CLIP LAST 30 SECONDS"\\n            android:layout_marginTop="10dp"\\n            android:backgroundTint="@color/accent"\\n            android:textColor="@color/onPrimary" />\\n    </LinearLayout>\\n</androidx.constraintlayout.widget.ConstraintLayout>\\n\',\n    \'app/src/main/res/layout/view_browser_overlay.xml\': \'<?xml version="1.0" encoding="utf-8"?>\\n<merge xmlns:android="http://schemas.android.com/apk/res/android">\\n\\n    <LinearLayout\\n        android:layout_width="match_parent"\\n        android:layout_height="match_parent"\\n        android:orientation="vertical"\\n        android:background="@color/surface"\\n        android:padding="6dp">\\n\\n        <LinearLayout\\n            android:layout_width="match_parent"\\n            android:layout_height="wrap_content"\\n            android:orientation="horizontal"\\n            android:gravity="end">\\n\\n            <ImageButton\\n                android:id="@+id/btnOverlayOpen"\\n                android:layout_width="36dp"\\n                android:layout_height="36dp"\\n                android:src="@android:drawable/ic_menu_view"\\n                android:contentDescription="Open"\\n                android:background="?attr/selectableItemBackgroundBorderless"\\n                android:tint="@color/onPrimary" />\\n\\n            <ImageButton\\n                android:id="@+id/btnOverlayClose"\\n                android:layout_width="36dp"\\n                android:layout_height="36dp"\\n                android:src="@android:drawable/ic_menu_close_clear_cancel"\\n                android:contentDescription="Close"\\n                android:background="?attr/selectableItemBackgroundBorderless"\\n                android:tint="@color/onPrimary" />\\n\\n        </LinearLayout>\\n\\n        <WebView\\n            android:id="@+id/overlayWebView"\\n            android:layout_width="match_parent"\\n            android:layout_height="0dp"\\n            android:layout_weight="1" />\\n\\n    </LinearLayout>\\n\\n</merge>\\n\',\n    \'app/src/main/res/values/colors.xml\': \'<?xml version="1.0" encoding="utf-8"?>\\n<resources>\\n    <!-- Existing basics -->\\n    <color name="black">#FF000000</color>\\n    <color name="white">#FFFFFFFF</color>\\n\\n    <!-- Added missing colors referenced from activity_main.xml and overlays -->\\n    <color name="background">#FFF5F7FA</color>\\n    <color name="onBackground">#FF121212</color>\\n    <color name="primary">#FF0D47A1</color>\\n    <color name="onPrimary">#FFFFFFFF</color>\\n    <color name="surface">#FFFFFFFF</color>\\n\\n    <!-- Preset swatches -->\\n    <color name="quality_720p60">#FF2E7D32</color>\\n    <color name="quality_720p30">#FF1565C0</color>\\n    <color name="quality_480p30">#FFF57F17</color>\\n    <color name="subtleText">#FF536273</color>\\n    <color name="previewBlack">#FF05070A</color>\\n    <color name="hudBackground">#99000000</color>\\n    <color name="accent">#FFE53935</color>\\n</resources>\\n\',\n    \'app/src/main/res/values/styles.xml\': \'<?xml version="1.0" encoding="utf-8"?>\\n<resources>\\n    <!-- Base application theme -->\\n    <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">\\n        <!-- Customize your theme here -->\\n        <item name="colorPrimary">#FF0055</item>\\n        <item name="colorSecondary">#00FFFF</item>\\n    </style>\\n</resources>\\n\',\n    \'app/src/main/res/values/strings.xml\': \'<?xml version="1.0" encoding="utf-8"?>\\n<resources>\\n    <string name="app_name">CaptureClip</string>\\n</resources>\\n\',\n    \'app/src/main/res/values/arrays.xml\': \'<?xml version="1.0" encoding="utf-8"?>\\n<resources>\\n    <string-array name="imValues">\\n        <item>1080p (Pro Quality)</item>\\n        <item>720p (Fast Stream)</item>\\n        <item>480p (Low Bandwidth)</item>\\n    </string-array>\\n</resources>\\n\',\n}\n\n\ndef run(command: list[str]) -> None:\n    print("$", " ".join(command))\n    subprocess.run(command, check=True)\n\n\ndef write_files(force: bool) -> list[str]:\n    written: list[str] = []\n    for relative_path, content in PROJECT_FILES.items():\n        path = Path(relative_path)\n        if path.exists() and not force:\n            print(f"skip existing {relative_path} (use --force to overwrite)")\n            continue\n        path.parent.mkdir(parents=True, exist_ok=True)\n        path.write_text(content, encoding="utf-8")\n        written.append(relative_path)\n        print(f"wrote {relative_path}")\n    return written\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(description="Create the CaptureClip Android project files.")\n    parser.add_argument("--force", action="store_true", help="Overwrite files that already exist.")\n    parser.add_argument("--commit", action="store_true", help="Run git add/commit after writing files.")\n    parser.add_argument("--push", action="store_true", help="Push the current branch after committing. Use only in Codespaces with an origin remote.")\n    args = parser.parse_args()\n\n    written = write_files(force=args.force)\n    print(f"\\nDone. {len(written)} file(s) written.")\n\n    if args.commit:\n        run(["git", "add", "."])\n        status = subprocess.run(["git", "status", "--short"], check=True, text=True, capture_output=True).stdout.strip()\n        if status:\n            run(["git", "commit", "-m", "Add CaptureClip Android project"])\n        else:\n            print("nothing to commit")\n\n    if args.push:\n        run(["git", "push", "-u", "origin", "HEAD"])\n\n    print("\\nNext steps:")\n    print("1. Open GitHub Actions and run/check the Build APK workflow.")\n    print("2. Download the app-debug artifact from app/build/outputs/apk/debug/.")\n\n\nif __name__ == "__main__":\n    main()\n',
          }
          for relative_path, content in PROJECT_FILES.items():
